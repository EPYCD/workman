# Workman + Marshal on one always-on machine, published through a Cloudflare
# tunnel. Copy .env.example to .env, fill it in, then `docker compose up -d`.
#
#   board.<domain>   -> workman:3456   (the API and the web app)
#   marshal.<domain> -> marshal:8090   (webhook receiver, panels API)
#
# Both hostnames are ingress rules of the same tunnel, configured in the
# Cloudflare dashboard (Zero Trust -> Networks -> Tunnels -> Public hostnames)
# or in cloudflared/config.yml when the tunnel is locally managed.
#
# Workman's webhooks target Marshal through the PUBLIC hostname on purpose:
# the API refuses private addresses (SSRF guard), and a public target is what
# `marshal setup` registers. GitHub Actions reach the board the same way.

services:
  workman:
    image: ${WORKMAN_IMAGE:-ghcr.io/epycd/workman:latest}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VIKUNJA_SERVICE_PUBLICURL: https://${BOARD_HOST}/
      VIKUNJA_SERVICE_JWTSECRET: ${WORKMAN_JWT_SECRET}
      VIKUNJA_SERVICE_ENABLEREGISTRATION: ${WORKMAN_ENABLE_REGISTRATION:-false}
      VIKUNJA_SERVICE_TIMEZONE: ${TZ:-UTC}
      VIKUNJA_SERVICE_MARSHALURL: https://${MARSHAL_HOST}
      VIKUNJA_SERVICE_LEASESTALEAFTER: ${WORKMAN_LEASE_STALE_AFTER:-4h}
      VIKUNJA_SERVICE_LEASEAUTORELEASEAFTER: ${WORKMAN_LEASE_AUTO_RELEASE_AFTER:-0}
      VIKUNJA_WEBHOOKS_ENABLED: "true"
      VIKUNJA_DATABASE_TYPE: postgres
      VIKUNJA_DATABASE_HOST: db
      VIKUNJA_DATABASE_USER: workman
      VIKUNJA_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      VIKUNJA_DATABASE_DATABASE: workman
      VIKUNJA_DATABASE_SSLMODE: disable
      VIKUNJA_CORS_ENABLE: "true"
      VIKUNJA_CORS_ORIGINS: https://${BOARD_HOST}
      VIKUNJA_MAILER_ENABLED: ${WORKMAN_MAILER_ENABLED:-false}
    volumes:
      - workman-files:/app/vikunja/files
    # Also on the forge's network, under a stable alias, so a CI job can reach
    # the board WITHOUT leaving the machine.
    #
    # Every workflow addressed it as https://workman.kaoxhq.tech, which means a
    # job running here went out to Cloudflare's edge and back down the tunnel to
    # a container sitting beside it. On 2026-09-08 the tunnel flapped for fifteen
    # minutes and three runs failed on it -- one of them named
    # "typecheck · lint · test", which is not what broke. A ticket then quietly
    # stayed open because the close hook could not reach the board.
    #
    # Same argument the runner already makes for talking to Forgejo over the
    # compose network: a job that depends on Cloudflare to reach a service on the
    # same host is one more thing that can break while nothing looks wrong.
    networks:
      default:
      forgejo:
        aliases:
          - workman
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/vikunja/vikunja", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: workman
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: workman
    volumes:
      - workman-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workman"]
      interval: 10s
      timeout: 5s
      retries: 10

  marshal:
    image: ${MARSHAL_IMAGE:-ghcr.io/epycd/marshal:latest}
    build:
      context: ../veans
      dockerfile: ../deploy/Dockerfile.marshal
    restart: unless-stopped
    command: ["serve", "--base", "${MARSHAL_BASE_BRANCH:-origin/main}", "--spec-rev", "${MARSHAL_SPEC_REV:-origin/main}"]
    working_dir: /repo
    environment:
      # A clone of the coordinated repository, with .veans.yml and .marshal.yml
      # committed. Marshal only reads it (git fetch, git log, file reads).
      MARSHAL_TOKEN: ${MARSHAL_TOKEN}
      MARSHAL_PUBLIC_URL: https://${MARSHAL_HOST}
      MARSHAL_WEBHOOK_SECRET: ${MARSHAL_WEBHOOK_SECRET}
      MARSHAL_DISCORD_WEBHOOK: ${DISCORD_WEBHOOK_URL:-}
      MARSHAL_LISTEN: 0.0.0.0:8090
      GIT_TERMINAL_PROMPT: "0"
      GIT_SSH_COMMAND: ssh -i /home/marshal/.ssh/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=/home/marshal/.ssh/known_hosts
    volumes:
      - ${REPO_PATH}:/repo
      - marshal-state:/repo/.marshal
      # The deploy key for the coordinated repository's SSH remote.
      - marshal-ssh:/home/marshal/.ssh
      # veans credential store (bot tokens). No keyring in the container, so
      # it falls back to a file here; without this volume a container
      # recreate loses the bot's token and needs `veans login` again.
      - marshal-config:/home/marshal/.config
    # Marshal fetches the coordinated clone itself, and that clone's origin is
    # now the forge. Same network need as repo-sync — missed when that one was
    # moved, and the symptom was `Could not resolve host: forgejo` once a minute
    # while the board itself stayed healthy, so nothing looked wrong.
    networks:
      - default
      - forgejo
    depends_on:
      workman:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5

  # Keeps the coordinated clone's working tree current. The spec needs none of
  # this — Marshal resolves it at origin/main and fetches every tick — but its
  # own configuration (.marshal.yml, .veans.yml) is read from the working tree
  # at process start, so a merged setting looked ignored until someone pulled
  # and restarted by hand.
  #
  # Runs as 10001, the clone's owner, so it never leaves a root-owned object in
  # .git — that would break Marshal's own fetch.
  #
  # It does NOT restart Marshal: doing so needs /var/run/docker.sock, which is
  # root-equivalent on the host and too much standing privilege for a loop that
  # needs it a few times a year. When a config file changes it logs ACTION
  # NEEDED and you run `docker compose restart marshal`. To automate it anyway,
  # mount the socket and add the host's docker group to this service.
  repo-sync:
    # The marshal image itself: it already carries git, openssh-client, and a
    # `marshal` user at uid 10001. ssh refuses to run when the uid it is given
    # has no /etc/passwd entry, which rules out a bare git image here.
    image: ${MARSHAL_IMAGE:-ghcr.io/epycd/marshal:latest}
    restart: unless-stopped
    user: "10001:10001"
    entrypoint: ["/bin/sh", "/opt/bin/repo-sync.sh"]
    environment:
      SYNC_INTERVAL: ${REPO_SYNC_INTERVAL:-300}
      SYNC_REF: ${MARSHAL_BASE_BRANCH:-origin/main}
      MARSHAL_CONTAINER: deploy-marshal-1
      # Same key and known_hosts Marshal fetches with.
      GIT_SSH_COMMAND: ssh -i /home/marshal/.ssh/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=/home/marshal/.ssh/known_hosts
      GIT_TERMINAL_PROMPT: "0"
    volumes:
      - ${REPO_PATH}:/repo
      # Mount the DIRECTORY, not the file. Docker Desktop stages single-file
      # bind mounts under a path it wipes on restart; the container then fails
      # to start with exit 127 and restart:unless-stopped cannot recover it.
      - ./scripts:/opt/bin:ro
      # The deploy key, so the fetch authenticates the same way Marshal's does.
      # Only used while origin is still an ssh remote on GitHub; the Forgejo
      # remote authenticates with a token in the URL instead.
      - marshal-ssh:/home/marshal/.ssh
    # The forge is in its own stack, so `forgejo` is only resolvable from its
    # network. Without this the fetch fails with a DNS error that reads as the
    # repository being gone rather than the network being wrong.
    networks:
      - default
      - forgejo
    depends_on:
      - marshal
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # --protocol http2, not the default quic.
    #
    # QUIC wants a UDP receive buffer of roughly 2.5MB; this host has the Linux
    # default of 212992 (~208KB) and neither raising it nor persisting it is
    # reliable here — net.core.* is not dependably namespaced for a container,
    # and WSL2 does not keep sysctls across a restart. Undersized buffers drop
    # packets under load, which cloudflared reports as
    # "failed to dial a quic connection: timeout: no recent network activity".
    #
    # That is what flapped for fifteen minutes on 2026-09-08: three CI runs died
    # on it, one of them named "typecheck · lint · test", and a ticket that had
    # merged green quietly stayed open because the close hook could not reach the
    # board. http2 carries the tunnel over TCP and has no such dependency.
    # Marginally slower than QUIC; for a home forge that is not a cost worth an
    # outage.
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - workman
      - marshal
    # gitler.kaoxhq.tech is served from the forgejo stack, which has its own
    # network. Without this the tunnel cannot resolve `forgejo` and that hostname
    # 502s while every container reports healthy — the failure looks like
    # Cloudflare, or the forge, and is neither.
    #
    # It was originally done with `docker network connect`, which works on a
    # running container and is lost the moment this one is recreated. Declared
    # here so a recreate cannot quietly undo it.
    networks:
      - default
      - forgejo

volumes:
  workman-files:
  workman-db:
  marshal-state:
  marshal-ssh:
  marshal-config:

networks:
  default:
  # Created by ~/srv/forgejo/docker-compose.yml. External so this stack joins it
  # rather than trying to own it.
  forgejo:
    external: true
    name: forgejo_default
